# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 量子点百科
  pageTitleSuffix: "｜学位论文知识库"
  baseUrl: logfe3.github.io/quantum-wiki
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Microsoft YaHei
      body: Microsoft YaHei
      code: Cascadia Mono
    colors:
      lightMode:
        light: "#f7f9fb"
        lightgray: "#e1e8ed"
        gray: "#9aa9b5"
        darkgray: "#425466"
        dark: "#17212b"
        secondary: "#087e8b"
        tertiary: "#6d5dfc"
        highlight: "rgba(8, 126, 139, 0.12)"
        textHighlight: "#ffe66d88"
      darkMode:
        light: "#10161d"
        lightgray: "#27333d"
        gray: "#667887"
        darkgray: "#d3dde5"
        dark: "#f2f6f8"
        secondary: "#5dd6d6"
        tertiary: "#a89bff"
        highlight: "rgba(93, 214, 214, 0.13)"
        textHighlight: "#8b7f2f88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
      katexOptions:
        strict: "ignore"
        throwOnError: false
    order: 80
  - source: "./plugins-local/cjk-math"
    enabled: true
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      folderClickBehavior: collapse
      folderDefaultState: collapsed
      useSavedState: true
      sortFn: |
        (a, b) => {
          const FOLDERS = ["fundamentals", "materials-devices", "qubit-control", "circuit-qed", "readout-measurement", "scaling-automation", "references"];
          const ENTRIES = {
            "fundamentals": ["two-dimensional-carrier-gas", "semiconductor-quantum-dot", "constant-interaction-model", "electrochemical-potential", "charging-energy", "zeeman-effect", "spin-orbit-coupling", "hyperfine-interaction", "valley-splitting", "coulomb-blockade", "coulomb-diamond", "double-quantum-dot", "charge-stability-diagram", "tunnel-coupling"],
            "materials-devices": ["gaas-algaas", "silicon-mos", "silicon-sige", "germanium-hut-wire", "strained-germanium", "micromagnet", "interface-defects", "charge-noise"],
            "qubit-control": ["charge-qubit", "single-spin-qubit", "hole-spin-qubit", "singlet-triplet-qubit", "hybrid-qubit", "resonant-exchange-qubit", "flopping-mode-qubit", "exchange-interaction", "exchange-gates", "landau-zener-transition", "lzsm-interference", "photon-assisted-tunneling", "rabi-oscillation", "ramsey-interferometry", "electric-dipole-spin-resonance", "dynamical-decoupling", "geometric-quantum-gate", "pauli-spin-blockade", "spin-initialization", "spin-decoherence", "cnot-gate", "toffoli-gate"],
            "circuit-qed": ["microwave-resonator", "cavity-linewidth", "circuit-quantum-electrodynamics", "jaynes-cummings-model", "strong-coupling", "vacuum-rabi-splitting", "dispersive-shift", "high-impedance-resonator", "squid-array-resonator", "charge-photon-coupling", "spin-photon-coupling", "cavity-mediated-coupling", "floquet-dynamics"],
            "readout-measurement": ["single-electron-transistor", "qpc-charge-sensor", "gate-based-sensing", "rf-reflectometry", "single-shot-readout", "energy-selective-readout", "threshold-independent-readout", "dispersive-readout", "parametric-amplifier", "purcell-filter", "readout-crosstalk"],
            "scaling-automation": ["quantum-dot-array", "virtual-gates", "cross-capacitance-matrix", "flopping-mode-qubit", "automatic-tuning", "charge-state-recognition", "two-dimensional-array", "cryo-electronics", "spin-orbit-torque-control"]
          };
          const top = a.slugSegments.length - 1;
          const ak = a.slugSegments[top], bk = b.slugSegments[top];
          if (ak === "index") return -1;
          if (bk === "index") return 1;
          if (a.isFolder && !b.isFolder) return -1;
          if (!a.isFolder && b.isFolder) return 1;
          if (a.isFolder && b.isFolder) {
            const ia = FOLDERS.indexOf(ak), ib = FOLDERS.indexOf(bk);
            if (ia >= 0 && ib >= 0) return ia - ib;
            if (ia >= 0) return -1;
            if (ib >= 0) return 1;
            return a.displayName.localeCompare(b.displayName, "zh-CN");
          }
          const parent = a.slugSegments[top - 1] || "";
          const list = ENTRIES[parent] || [];
          const ia = list.indexOf(ak), ib = list.indexOf(bk);
          if (ia >= 0 && ib >= 0) return ia - ib;
          if (ia >= 0) return -1;
          if (ib >= 0) return 1;
          return a.displayName.localeCompare(b.displayName, "zh-CN");
        }
      filterFn: |
        (node) => {
          if (node.isFolder) return true;
          if (node.slugSegments.includes("assets")) return false;
          return true;
        }
      order: ["filter", "sort", "map"]
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 1.1
        repelForce: 0.5
        centerForce: 0.3
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        showTags: true
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        repelForce: 0.5
        centerForce: 0.2
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        showTags: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    options:
      enablePreview: true
      fieldPriority:
        - title
        - content
        - tags
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      showReadingTime: true
      showComma: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        主站: https://chenzhaoyun.com
        Wiki 门户: https://wiki.chenzhaoyun.com
        教程门户: https://tutorial.chenzhaoyun.com
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
        - source
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
